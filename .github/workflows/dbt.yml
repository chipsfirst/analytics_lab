name: dbt build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dbt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/dbt-subscription
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверить версию Python
        run: python scripts/check_python.py
      - name: Установить dbt
        run: pip install -r requirements.txt
      - name: Подготовить seeds из данных сайта
        run: |
          mkdir -p seeds
          cp ../../data/sub-users.csv seeds/sub_users.csv
          cp ../../data/sub-subscriptions.csv seeds/sub_subscriptions.csv
          cp ../../data/sub-payments.csv seeds/sub_payments.csv
          cp ../../data/sub-tickets.csv seeds/sub_tickets.csv
      # source freshness не запускаем: _loaded_at в синтетических seeds фиксирован,
      # поэтому проверка была бы демонстрационной. Запускайте локально на реальных данных.
      - name: Профиль DuckDB
        run: cp profiles.yml.example profiles.yml
      - name: dbt seed
        run: dbt seed --profiles-dir .
      - name: dbt build
        run: dbt build --profiles-dir .
      - name: dbt docs
        run: dbt docs generate --profiles-dir .
      - name: Сохранить docs
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: projects/dbt-subscription/target
