name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Проверить единую версию
        run: python3 tools/check-version.py
      - name: Проверить списки модулей
        run: python3 tools/check-modules.py
      - name: Проверка контента и генераторов
        run: node selftest.js
      - name: Установить smoke-зависимости
        run: npm install --no-audit --no-fund
      - name: Установить Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke-тест интеракций
        run: npm run smoke

  deploy:
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Собрать офлайн-архив
        run: python3 tools/make-offline.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Пауза перед публикацией
        run: sleep 45
      - id: deployment
        uses: actions/deploy-pages@v4
