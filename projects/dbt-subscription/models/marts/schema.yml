version: 2

models:
  - name: dim_users
    columns:
      - name: user_id
        tests: [unique, not_null]

  - name: fct_payments
    columns:
      - name: payment_id
        tests: [unique, not_null]
      - name: user_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_id

  - name: mart_subscription_health
    columns:
      - name: subscription_id
        tests: [unique, not_null]
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['active', 'cancelled']

  - name: mart_monthly_revenue
    columns:
      - name: month_channel
        tests: [unique, not_null]
      - name: month
        tests: [not_null]
      - name: channel
        tests: [not_null]

  - name: mart_channel_cohort
    columns:
      - name: channel
        tests: [unique, not_null]

  - name: mart_payment_summary
    columns:
      - name: status_channel
        tests: [unique, not_null]
      - name: status
        tests: [not_null]
      - name: channel
        tests: [not_null]
