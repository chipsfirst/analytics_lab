version: 2

models:
  - name: stg_users
    columns:
      - name: user_id
        tests: [unique, not_null]
      - name: channel
        tests:
          - accepted_values:
              values: ['paid_search', 'social', 'referral', 'email']

  - name: stg_subscriptions
    columns:
      - name: subscription_id
        tests: [unique, not_null]
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_users')
              field: user_id
      - name: plan
        tests:
          - accepted_values:
              values: ['basic', 'pro']
      - name: status
        tests:
          - accepted_values:
              values: ['active', 'cancelled']

  - name: stg_payments
    columns:
      - name: payment_id
        tests: [unique, not_null]
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_users')
              field: user_id
      - name: subscription_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_subscriptions')
              field: subscription_id
      - name: status
        tests:
          - accepted_values:
              values: ['paid', 'failed', 'refunded']
      - name: method
        tests:
          - accepted_values:
              values: ['card', 'sbp', 'apple_pay']

  - name: stg_tickets
    columns:
      - name: ticket_id
        tests: [unique, not_null]
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_users')
              field: user_id
